name: release

# Every push to main (a merged develop -> main PR) publishes the version in
# src/pkg/version/version.go as tag vX.Y.Z with its binaries.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Read version
        id: version
        run: |
          v=$(sed -n 's/^const Version = "\(.*\)"$/\1/p' src/pkg/version/version.go)
          test -n "$v"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Fail if the release already exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; bump const Version on develop first (AGENTS.md Rule 8)."
            exit 1
          fi

      - run: make ci
      - run: make dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v h="## [$VERSION]" 'index($0, h) == 1 {f = 1; next} /^## \[/ {f = 0} f' CHANGELOG.md > notes.md
          gh release create "$TAG" src/dist/* \
            --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md
